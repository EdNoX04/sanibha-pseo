[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanibha-pseo"
version = "1.0.0"
description = "Programmatic SEO agent: keyword list -> unique, QA-checked landing pages"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.20",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pseo = "pseo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
